<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1.2 | Esferas rebotando en una caja de cristal</title>
    <link rel="stylesheet" href="./assets/css/styles.css">

    <script type="importmap">
 {
   "imports": {
     "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
   }
 }
 </script>
</head>

<body>
    <header class="panel">
        <h1>Esferas rebotando en una caja de cristal</h1>
        <p>Three.js: movimiento 3D, vectores, colisiones y partículas.</p>
    </header>

    <aside class="controls-panel" id="controls-panel">
        <h2>Controles</h2>

        <div class="control-group">
            <label for="sphere-count">
                Número de esferas <span class="value" id="sphere-count-value">5</span>
            </label>
            <input type="range" id="sphere-count" min="1" max="20" step="1" value="5">
        </div>

        <hr class="control-divider">

        <div class="control-group">
            <label for="speed-x">
                Velocidad X <span class="value" id="speed-x-value">0.035</span>
            </label>
            <input type="range" id="speed-x" min="0" max="0.15" step="0.001" value="0.035">
        </div>

        <div class="control-group">
            <label for="speed-y">
                Velocidad Y <span class="value" id="speed-y-value">0.027</span>
            </label>
            <input type="range" id="speed-y" min="0" max="0.15" step="0.001" value="0.027">
        </div>

        <div class="control-group">
            <label for="speed-z">
                Velocidad Z <span class="value" id="speed-z-value">0.041</span>
            </label>
            <input type="range" id="speed-z" min="0" max="0.15" step="0.001" value="0.041">
        </div>
    </aside>

    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
